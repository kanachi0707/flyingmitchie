<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>フライングみっちー</title>
  <meta
    name="description"
    content="タイトル画面からコースを選んで遊べる three.js のフライングランナー。空、海、宇宙、街の 4 モードを収録。"
  >
  <meta name="theme-color" content="#80d5ff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Space+Grotesk:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="./style.css">
</head>
<body data-stage="sky" data-screen="intro">
  <div id="sceneRoot" class="scene-root" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <main class="ui-shell">
    <header class="hud-bar" aria-label="Game HUD">
      <div class="hud-stack">
        <div id="scoreHud" class="score-hud" hidden>
          <div class="hud-metrics">
            <div class="hud-metric">
              <span class="hud-label">Wall</span>
              <strong id="wallValue" class="hud-value">0</strong>
            </div>
            <div class="hud-metric">
              <span class="hud-label">Miss</span>
              <strong id="missValue" class="hud-value">0</strong>
            </div>
            <div class="hud-metric">
              <span class="hud-label">Score</span>
              <strong id="scoreValue" class="hud-value">0</strong>
            </div>
          </div>
          <button class="music-track-button" type="button" data-preview-track="failed">
            <span class="music-track-order">05</span>
            <span class="music-track-meta">
              <strong>ゲームオーバー BGM</strong>
              <em>game failed (8bit)</em>
            </span>
          </button>
        </div>
        <div id="lifeHud" class="life-hud" hidden aria-label="Lives">
          <span class="hud-label">Guard</span>
          <div class="life-icons">
            <span class="life-token" data-life-index="0">
              <img class="life-icon" src="./assets/life-icon.png" alt="">
            </span>
            <span class="life-token" data-life-index="1">
              <img class="life-icon" src="./assets/life-icon.png" alt="">
            </span>
          </div>
        </div>
      </div>
      <div class="utility-bar">
        <div id="timeHud" class="time-hud" hidden>
          <span class="hud-label">Time</span>
          <strong id="timeValue" class="time-value">00:00:00</strong>
        </div>
        <button id="soundButton" class="utility-button" type="button">SOUND ON</button>
      </div>
    </header>

    <section id="introScreen" class="screen intro-screen" aria-label="Title">
      <div class="intro-shell">
        <img class="title-logo" src="./assets/fm-logo-wm.png" alt="フライングみっちー">
        <div class="title-actions">
          <button id="gameModeButton" class="title-mode-button primary-button" type="button" onclick="window.__openGameModeFallback && window.__openGameModeFallback()" onpointerup="window.__openGameModeFallback && window.__openGameModeFallback()">GAME MODE</button>
          <button id="musicModeButton" class="title-mode-button secondary-button" type="button" onclick="window.__openMusicModeFallback && window.__openMusicModeFallback()" onpointerup="window.__openMusicModeFallback && window.__openMusicModeFallback()">MUSIC MODE</button>
        </div>
        <div class="title-credit" aria-label="Credits">
          <p>©再生の道／みっちー</p>
          <p>非公式／Created with AI</p>
          <p>Created by @kanachi0707</p>
        </div>
      </div>
    </section>

    <section id="musicScreen" class="screen music-screen" aria-label="Music mode" hidden>
      <div class="music-shell">
        <p class="music-kicker">MUSIC MODE</p>
        <h2 class="music-title">Sound Select</h2>
        <p class="music-copy">空、海、クリアの BGM をここで選んで再生できます。</p>

        <div class="music-track-grid" role="group" aria-label="Music track selection">
          <button class="music-track-button" type="button" data-preview-track="sky">
            <span class="music-track-order">01</span>
            <span class="music-track-meta">
              <strong>空 BGM</strong>
              <em>Rebirth (8bit Remix)</em>
            </span>
          </button>
          <button class="music-track-button" type="button" data-preview-track="sea">
            <span class="music-track-order">02</span>
            <span class="music-track-meta">
              <strong>海 BGM</strong>
              <em>ラムネ (8bit Remix)</em>
            </span>
          </button>
          <button class="music-track-button is-locked" type="button" data-preview-track="space">
            <span class="music-track-order">03</span>
            <span class="music-track-meta">
              <strong>宇宙 BGM</strong>
              <em>Shooting Star (8bit Remix)</em>
            </span>
            <span class="music-track-status">COMING SOON</span>
          </button>
          <button class="music-track-button" type="button" data-preview-track="clear">
            <span class="music-track-order">04</span>
            <span class="music-track-meta">
              <strong>クリア BGM</strong>
              <em>game clear (8bit)</em>
            </span>
          </button>
        </div>

        <div class="music-actions">
          <button id="musicPrevButton" class="secondary-button" type="button">&lt;&lt;</button>
          <button id="musicPlayButton" class="secondary-button" type="button">PLAY</button>
          <button id="musicNextButton" class="secondary-button" type="button">&gt;&gt;</button>
          <button id="musicShuffleButton" class="secondary-button music-option-button" type="button" aria-label="Shuffle" title="Shuffle">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M4 7h5l7 10h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M17 5l3 2-3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M4 17h5l2-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M17 15l3 2-3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button id="musicRepeatButton" class="secondary-button music-option-button" type="button" aria-label="Repeat" title="Repeat">↻</button>
          <button id="musicStopButton" class="secondary-button" type="button">STOP</button>
        </div>
        <div class="music-back-row">
          <button id="musicBackButton" class="link-button" type="button">タイトルに戻る</button>
        </div>
      </div>
    </section>

    <section id="selectScreen" class="screen select-screen" aria-label="Stage select" hidden>
      <div class="stage-list">
        <button class="stage-option" type="button" data-mode="sky" data-theme="sky" onclick="window.__startModeFallback && window.__startModeFallback('sky')" onpointerup="window.__startModeFallback && window.__startModeFallback('sky')">
          <span class="stage-order">01</span>
          <span class="stage-meta">
            <span class="stage-kicker">Beginner</span>
            <span class="stage-subname">SKY</span>
            <strong>空</strong>
            <em></em>
          </span>
          <span class="stage-summary"></span>
          <span id="best-sky" class="stage-best">BEST SCORE 0</span>
        </button>

        <button class="stage-option" type="button" data-mode="sea" data-theme="sea" onclick="window.__startModeFallback && window.__startModeFallback('sea')" onpointerup="window.__startModeFallback && window.__startModeFallback('sea')">
          <span class="stage-order">02</span>
          <span class="stage-meta">
            <span class="stage-kicker">Normal</span>
            <span class="stage-subname">SEA</span>
            <strong>海</strong>
            <em></em>
          </span>
          <span class="stage-summary"></span>
          <span id="best-sea" class="stage-best">BEST SCORE 0</span>
        </button>

        <button class="stage-option" type="button" data-mode="space" data-theme="space" onclick="window.__startModeFallback && window.__startModeFallback('space')" onpointerup="window.__startModeFallback && window.__startModeFallback('space')">
          <span class="stage-order">03</span>
          <span class="stage-meta">
            <span class="stage-kicker">Hard</span>
            <span class="stage-subname">SPACE</span>
            <strong>宇宙</strong>
            <em></em>
          </span>
          <span class="stage-summary"></span>
          <span id="best-space" class="stage-best">BEST SCORE 0</span>
        </button>

        <div class="stage-option-card" data-theme="city">
          <button class="stage-option stage-option-main" type="button" data-mode="city" data-theme="city" onclick="window.__startModeFallback && window.__startModeFallback('city')" onpointerup="window.__startModeFallback && window.__startModeFallback('city')">
            <span class="stage-order">04</span>
            <span class="stage-meta">
              <span class="stage-kicker">Score Attack</span>
              <span class="stage-subname">CITY</span>
              <strong>街</strong>
              <em></em>
            </span>
            <span class="stage-summary"></span>
            <span id="best-city" class="stage-best">BEST SCORE 0</span>
          </button>

          <section class="city-track-panel city-track-panel--inline" aria-label="City soundtrack">
            <p class="city-track-label">BGM</p>
            <div class="city-track-options" role="group" aria-label="City soundtrack selection">
              <button class="track-option" type="button" data-city-track="sky">空</button>
              <button class="track-option" type="button" data-city-track="sea">海</button>
              <button class="track-option" type="button" data-city-track="space">宇宙</button>
              <button class="track-option" type="button" data-city-track="city">街</button>
            </div>
          </section>
        </div>
      </div>

      <button id="titleButton" class="link-button" type="button">タイトルに戻る</button>
    </section>

    <section id="resultScreen" class="screen result-screen" aria-label="Result" hidden>
      <div class="clear-burst" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>
      <p class="eyebrow">Result</p>
      <p id="resultBadge" class="result-badge">RESULT</p>
      <h2 id="resultTitle">Result</h2>
      <p id="resultLead" class="result-copy"></p>

      <div class="result-stats">
        <div class="result-stat">
          <span>Score</span>
          <strong id="resultScore">0</strong>
        </div>
        <div class="result-stat">
          <span>Best</span>
          <strong id="resultBest">0</strong>
        </div>
        <div class="result-stat">
          <span>Time</span>
          <strong id="resultTime">00:00:00</strong>
        </div>
        <div class="result-stat">
          <span>Miss</span>
          <strong id="resultMiss">0</strong>
        </div>
      </div>

      <div class="result-actions">
        <button id="retryButton" class="primary-button" type="button">もう一度</button>
        <button id="selectButton" class="secondary-button" type="button">コース選択</button>
        <button id="homeButton" class="secondary-button" type="button">タイトルに戻る</button>
      </div>
    </section>

    <section id="messageBar" class="message-bar" aria-live="polite"></section>
    <p class="play-credit" aria-label="Gameplay credit">©再生の道／みっちー（非公式）</p>
  </main>

  <noscript>このゲームを遊ぶには JavaScript を有効にしてください。</noscript>
  <script src="./app.bundle.js?v=20260422f"></script>
  <script>
    window.__bundleBootError = "";
    window.addEventListener("error", function (event) {
      window.__bundleBootError = event && event.message ? event.message : "unknown error";
    });

    window.__setMessageFallback = function (text) {
      var message = document.getElementById("messageBar");
      if (message) {
        message.textContent = text || "";
      }
    };

    window.__setScreenFallback = function (screen) {
      var intro = document.getElementById("introScreen");
      var music = document.getElementById("musicScreen");
      var select = document.getElementById("selectScreen");
      var result = document.getElementById("resultScreen");

      if (intro) intro.hidden = screen !== "intro";
      if (music) music.hidden = screen !== "music";
      if (select) select.hidden = screen !== "select";
      if (result) result.hidden = screen !== "result";
      if (document.body) document.body.dataset.screen = screen;
    };

    window.__supportsWebGLFallback = function () {
      try {
        var canvas = document.createElement("canvas");
        return !!(
          canvas.getContext("webgl2")
          || canvas.getContext("webgl")
          || canvas.getContext("experimental-webgl")
        );
      } catch (error) {
        return false;
      }
    };

    window.__openGameModeFallback = function () {
      window.__setScreenFallback("select");
      if (window.__openGameMode) {
        window.__openGameMode();
      }
    };

    window.__openMusicModeFallback = function () {
      window.__setScreenFallback("music");
      if (window.__openMusicMode) {
        window.__openMusicMode();
      }
    };

    window.__startModeFallback = function (modeKey) {
      if (window.__bundleReadyStage !== "ready" || !window.__startMode) {
        var stage = window.__bundleReadyStage || "unknown";
        var detail = window.__bundleBootError ? " / " + window.__bundleBootError : "";
        window.__setMessageFallback("ゲーム本体の初期化が途中で止まっています。stage: " + stage + detail);
        return;
      }

      if (!window.__supportsWebGLFallback()) {
        window.__setMessageFallback("この IAB では WebGL が使えないため、3Dゲームを開始できません。");
        return;
      }

      window.__setMessageFallback("3Dシーンを起動しています...");
      window.__setScreenFallback("running");
      if (window.__startMode) {
        window.setTimeout(function () {
          window.__startMode(modeKey);
        }, 0);
      }

      window.setTimeout(function () {
        var sceneRoot = document.getElementById("sceneRoot");
        var hasCanvas = sceneRoot && sceneRoot.querySelector("canvas");
        if (!hasCanvas || document.body.dataset.screen !== "running") {
          window.__setScreenFallback("select");
          window.__setMessageFallback("3Dシーンの起動に失敗しました。IAB では WebGL 初期化が止まることがあります。");
          return;
        }

        window.__setMessageFallback("");
      }, 1000);
    };

    window.__penguinReady = window.__penguinReady === true;
    window.addEventListener("load", function () {
      window.setTimeout(function () {
        if (window.__penguinReady) {
          return;
        }

        var message = document.getElementById("messageBar");
        if (message) {
          message.textContent = "three.js の読み込みに失敗しました。GitHub Pages か http:// のローカルサーバーで開いてください。";
        }
      }, 2000);
    });
  </script>
</body>
</html>
