<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>フライングみっちー</title>
  <meta
    name="description"
    content="タイトル画面からコースを選んで遊べる three.js のフライングランナー。空、海、宇宙、街の 4 モードを収録。"
  >
  <meta name="theme-color" content="#80d5ff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Space+Grotesk:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="./style.css">
</head>
<body data-stage="sky" data-screen="intro">
  <div id="sceneRoot" class="scene-root" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <main class="ui-shell">
    <header class="hud-bar" aria-label="Game HUD">
      <div class="hud-stack">
        <div id="scoreHud" class="score-hud" hidden>
          <span class="hud-label">Score</span>
          <strong id="scoreValue" class="hud-value">0</strong>
          <button class="music-track-button" type="button" data-preview-track="failed">
            <span class="music-track-order">05</span>
            <span class="music-track-meta">
              <strong>繧ｲ繝ｼ繝繧ｪ繝ｼ繝舌・ BGM</strong>
              <em>game failed (8bit)</em>
            </span>
          </button>
        </div>
        <div id="lifeHud" class="life-hud" hidden aria-label="Lives">
          <span class="hud-label">Guard</span>
          <div class="life-icons">
            <span class="life-token" data-life-index="0">
              <img class="life-icon" src="./assets/life-icon.png" alt="">
            </span>
            <span class="life-token" data-life-index="1">
              <img class="life-icon" src="./assets/life-icon.png" alt="">
            </span>
          </div>
        </div>
      </div>
      <div class="utility-bar">
        <p class="top-title">フライングみっちー</p>
        <button id="soundButton" class="utility-button" type="button">SOUND ON</button>
      </div>
    </header>

    <section id="introScreen" class="screen intro-screen" aria-label="Title">
      <div class="intro-shell">
        <p class="title-badge">FLYING MICCHI</p>
        <h1 class="title-headline">フライングみっちー</h1>
        <div class="title-actions">
          <button id="gameModeButton" class="title-mode-button primary-button" type="button">GAME MODE</button>
          <button id="musicModeButton" class="title-mode-button secondary-button" type="button">MUSIC MODE</button>
        </div>
      </div>
    </section>

    <section id="musicScreen" class="screen music-screen" aria-label="Music mode" hidden>
      <div class="music-shell">
        <p class="music-kicker">MUSIC MODE</p>
        <h2 class="music-title">Title Sound Select</h2>
        <p class="music-copy">空、海、クリアのBGMをここで選んで再生できます。</p>

        <div class="music-track-grid" role="group" aria-label="Music track selection">
          <button class="music-track-button" type="button" data-preview-track="sky">
            <span class="music-track-order">01</span>
            <span class="music-track-meta">
              <strong>空 BGM</strong>
              <em>Rebirth (8bit Remix)</em>
            </span>
          </button>
          <button class="music-track-button" type="button" data-preview-track="sea">
            <span class="music-track-order">02</span>
            <span class="music-track-meta">
              <strong>海 BGM</strong>
              <em>ラムネ (8bit Remix)</em>
            </span>
          </button>
          <button class="music-track-button is-locked" type="button" data-preview-track="space">
            <span class="music-track-order">03</span>
            <span class="music-track-meta">
              <strong>螳・ｮ・BGM</strong>
              <em>Shooting Star (8bit Remix)</em>
            </span>
            <span class="music-track-status">COMING SOON</span>
          </button>
          <button class="music-track-button" type="button" data-preview-track="clear">
            <span class="music-track-order">04</span>
            <span class="music-track-meta">
              <strong>クリア BGM</strong>
              <em>game clear (8bit)</em>
            </span>
          </button>
        </div>

        <div class="music-actions">
          <button id="musicPrevButton" class="secondary-button" type="button">PREV</button>
          <button id="musicRandomButton" class="secondary-button" type="button">RANDOM</button>
          <button id="musicNextButton" class="secondary-button" type="button">NEXT</button>
          <button id="musicStopButton" class="secondary-button" type="button">STOP</button>
          <button id="musicBackButton" class="link-button" type="button">TITLE</button>
        </div>
      </div>
    </section>

    <section id="selectScreen" class="screen select-screen" aria-label="Stage select" hidden>
      <div class="stage-list">
        <button class="stage-option" type="button" data-mode="sky" data-theme="sky">
          <span class="stage-order">01</span>
          <span class="stage-meta">
            <span class="stage-kicker">Beginner</span>
            <strong>空</strong>
            <em>速度固定で 50 リング</em>
          </span>
          <span class="stage-summary">いちばん遊びやすい基本コース</span>
          <span id="best-sky" class="stage-best">Best 0</span>
        </button>

        <button class="stage-option" type="button" data-mode="sea" data-theme="sea">
          <span class="stage-order">02</span>
          <span class="stage-meta">
            <span class="stage-kicker">Normal</span>
            <strong>海</strong>
            <em>0.1 ずつ加速して 100 リング</em>
          </span>
          <span class="stage-summary">緩やかに速くなる中級ルート</span>
          <span id="best-sea" class="stage-best">Best 0</span>
        </button>

        <button class="stage-option" type="button" data-mode="space" data-theme="space">
          <span class="stage-order">03</span>
          <span class="stage-meta">
            <span class="stage-kicker">Hard</span>
            <strong>宇宙</strong>
            <em>0.1 ずつ加速して 200 リング</em>
          </span>
          <span class="stage-summary">高速感が続く上級コース</span>
          <span id="best-space" class="stage-best">Best 0</span>
        </button>

        <button class="stage-option" type="button" data-mode="city" data-theme="city">
          <span class="stage-order">04</span>
          <span class="stage-meta">
            <span class="stage-kicker">Score Attack</span>
            <strong>街</strong>
            <em>20 リングごとに星が現れるエンドレス</em>
          </span>
          <span class="stage-summary">星を取るとスコア +10</span>
          <span id="best-city" class="stage-best">Best 0</span>
        </button>
      </div>

      <section class="city-track-panel" aria-label="City soundtrack">
        <p class="city-track-label">街 BGM</p>
        <div class="city-track-options" role="group" aria-label="City soundtrack selection">
          <button class="track-option" type="button" data-city-track="sky">空</button>
          <button class="track-option" type="button" data-city-track="sea">海</button>
          <button class="track-option" type="button" data-city-track="space">宇宙</button>
          <button class="track-option" type="button" data-city-track="city">街</button>
        </div>
      </section>

      <button id="titleButton" class="link-button" type="button">TITLE に戻る</button>
    </section>

    <section id="resultScreen" class="screen result-screen" aria-label="Result" hidden>
      <div class="clear-burst" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>
      <p class="eyebrow">Result</p>
      <p id="resultBadge" class="result-badge">RESULT</p>
      <h2 id="resultTitle">Result</h2>
      <p id="resultLead" class="result-copy"></p>

      <div class="result-stats">
        <div class="result-stat">
          <span>Score</span>
          <strong id="resultScore">0</strong>
        </div>
        <div class="result-stat">
          <span>Best</span>
          <strong id="resultBest">0</strong>
        </div>
      </div>

      <div class="result-actions">
        <button id="retryButton" class="primary-button" type="button">もう一度</button>
        <button id="selectButton" class="secondary-button" type="button">コース選択</button>
        <button id="homeButton" class="secondary-button" type="button">タイトルへ戻る</button>
      </div>
    </section>

    <section id="messageBar" class="message-bar" aria-live="polite"></section>
  </main>

  <noscript>このゲームを遊ぶには JavaScript を有効にしてください。</noscript>
  <script type="module" src="./script.js"></script>
  <script>
    window.__penguinReady = false;
    window.addEventListener("load", function () {
      window.setTimeout(function () {
        if (window.__penguinReady) {
          return;
        }

        var message = document.getElementById("messageBar");
        if (message) {
          message.textContent = "three.js の読み込みに失敗しました。GitHub Pages か http:// のローカルサーバーで開いてください。";
        }
      }, 2000);
    });
  </script>
</body>
</html>
